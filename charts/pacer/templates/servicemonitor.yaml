{{- if .Values.monitoring.enabled -}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "pacer.fullname" . }}
  labels:
    {{- include "pacer.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "pacer.selectorLabels" . | nindent 6 }}
  endpoints:    
    - port: http
      path: /metrics
      interval: {{ .Values.monitoring.interval }}
{{- end }}
