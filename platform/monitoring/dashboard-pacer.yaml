apiVersion: v1
kind: ConfigMap
metadata:
  name: pacer-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  pacer.json: |
    {
      "title": "pacer",
      "uid": "pacer-overview",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "panels": [
        {
          "type": "timeseries",
          "title": "Requests per second",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(rate(pacer_http_requests_total[5m])) by (path)",
              "legendFormat": "{{path}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Latency percentiles",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum(rate(pacer_http_request_duration_seconds_bucket[5m])) by (le))",
              "legendFormat": "p50",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(pacer_http_request_duration_seconds_bucket[5m])) by (le))",
              "legendFormat": "p95",
              "refId": "B"
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(pacer_http_request_duration_seconds_bucket[5m])) by (le))",
              "legendFormat": "p99",
              "refId": "C"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Error ratio",
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 0,
            "y": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 0.05
                  }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(rate(pacer_http_requests_total{status=~\"5..\"}[5m])) / clamp_min(sum(rate(pacer_http_requests_total[5m])), 0.001)",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Ready pods",
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 6,
            "y": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "kube_deployment_status_replicas_ready{deployment=\"pacer\", namespace=\"pacer\"}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Calculations by outcome",
          "gridPos": {
            "h": 6,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(increase(pacer_calculations_total[5m])) by (outcome)",
              "legendFormat": "{{outcome}}",
              "refId": "A"
            }
          ]
        }
      ]
    }
